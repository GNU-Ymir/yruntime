name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: midgard-build:${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build midgard
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}
          cache-to: "true"

  examples:
    name: examples
    needs: build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - name: Compile the examples of the doc comments
        run: docker run --rm "$IMAGE" ./dev/check-examples.sh

  shard:
    name: ${{ matrix.shard }}
    needs: build
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: algorithm
            filters: >-
              algorithm::*::*
              algorithm::searching::*::*

          - shard: text
            filters: >-
              char::*
              conv::*
              format::*
              syntax::*

          - shard: io
            filters: >-
              io::*
              stream::*
              net::*

          - shard: fs
            filters: >-
              fs::*::*

          - shard: config
            filters: >-
              config::*
              env::*
              testrt_filters::*
              testrt_mailbox::*

          - shard: math
            filters: >-
              math::*
              rand::*
              time::*
              unit::*

          - shard: concurrency
            filters: >-
              concurrency::*::*
              any::*
              box::*
              collection::*::*

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - name: Run the ${{ matrix.shard }} tests
        env:
          CONTAINER: midgard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          SHARD: ${{ matrix.shard }}
          FILTERS: ${{ matrix.filters }}
          JOBS: ${{ matrix.jobs }}
        run: |
          set -uo pipefail
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

          code=0
          set -f
          docker run --name "$CONTAINER" -e JOBS="$JOBS" "$IMAGE" \
              bash .github/scripts/run-shard.sh "$SHARD" $FILTERS || code=$?
          set +f

          rm -rf ./shard-out
          docker cp "$CONTAINER:/tmp/shard-out" ./shard-out || true
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

          exit "$code"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard-out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    needs: shard
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          tag: ${{ env.IMAGE }}

      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          merge-multiple: true
          path: merged

      - name: Merge the shard results
        run: |
          set -euo pipefail
          ls -l merged

          awk -F';' 'NF == 2 {
                       if ($2 == "false") failed[$1] = 1
                       seen[$1] = 1
                     }
                     END {
                       for (test in seen) print test ";" (test in failed ? "false" : "true")
                     }' merged/success-*.txt > merged/.ymir_test_success
          rm -f merged/success-*.txt

          echo "$(wc -l < merged/.ymir_test_success) test result(s) merged from" \
               "$(find merged -name '.ymir_coverage_*.json' | wc -l) coverage file(s)"

      - name: Report the whole-suite coverage
        id: run_tests
        run: |
          set -uo pipefail

          CID="$(docker create "$IMAGE" ./midgard_tests --resume -cov)"
          docker cp merged/. "$CID:/midgard/"

          set +e
          docker start -a "$CID" 2>&1 | tee coverage.txt
          code="$(docker wait "$CID")"
          docker rm -f "$CID" >/dev/null 2>&1

          exit "${code:-1}"

      - name: Publish coverage summary
        if: always()
        run: bash .github/scripts/coverage-summary.sh coverage.txt "${{ steps.run_tests.outcome }}"

  cleanup:
    name: Cleanup
    if: always()
    needs: [build, examples, shard, coverage]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Drop this run's image tag
        run: docker image rm -f "$IMAGE" || true
