name: Release

# Manual, production counterpart to release-preview.yml: unlike the preview job, this fails
# instead of overwriting if the target version has already been released. The tag/release name
# is v<ymirBootstrapVersion>__m<midgardVersion>, read from YMIR_VERSION and VERSION - bump one
# or both of those files before dispatching this again for a new release.
#
# Also dispatched by github.com/GNU-Ymir/gymir's release.yml, on the branch whose head it has just
# bundled into a published gyc: a midgard that needs a new gyc can only be released once that gyc
# is out, and this is where the release happens then. gymir passes the commit it bundled as `sha`,
# so a branch that moved since fails here instead of being tagged on a commit that gyc does not
# carry. Run on any branch other than the default one, a successful release ends by merging that
# branch's pull request - with a merge commit, so the commit just tagged ends up on master.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit the release must be cut from (set by gymir's release); empty = the branch head"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    steps:
      # fetch-depth: 0 so the changelog step below has the history and the tags it walks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the branch is still at the requested commit
        if: ${{ inputs.sha != '' }}
        env:
          WANTED: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_SHA" != "$WANTED" ]; then
            echo "::error::${GITHUB_REF_NAME} is at ${GITHUB_SHA}, not ${WANTED} - it moved after gymir bundled ${WANTED}. Release that commit by hand, or re-release gymir from the new head."
            exit 1
          fi

      # The self-hosted runners have no gh CLI of their own; the release steps below need one.
      - uses: ./.github/actions/setup-gh

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          MIDGARD_VERSION="$(tr -d '[:space:]' < VERSION)"
          GCC_MAJOR="${GCC_VERSION%%.*}"
          TAG_NAME="${MIDGARD_VERSION}"
          echo "midgard_version=${MIDGARD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_bootstrap_version=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gcc_version=${GCC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "gyllir_version=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_asset=gyllir_${GYLLIR_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure this version has not already been released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists - bump VERSION and/or YMIR_VERSION before releasing again."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin (with no matching release) - bump VERSION and/or YMIR_VERSION before releasing again."
            exit 1
          fi

      # The release body: the build provenance line, then one entry per pull request merged
      # since the previous release (grouped by the `[kind]` of its title), then a compare link.
      - name: Build release notes
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          MIDGARD_VERSION: ${{ steps.version.outputs.midgard_version }}
          YMIR_BOOTSTRAP_VERSION: ${{ steps.version.outputs.ymir_bootstrap_version }}
          GCC_VERSION: ${{ steps.version.outputs.gcc_version }}
        run: |
          set -euo pipefail

          BASE="$(bash .github/scripts/changelog.sh --print-base)"

          {
            echo "Midgard ${MIDGARD_VERSION}, built against ymir bootstrap ${YMIR_BOOTSTRAP_VERSION} (gcc ${GCC_VERSION}) @ ${GITHUB_SHA}."
            echo
            if [ -n "$BASE" ]; then
              echo "## What's changed since ${BASE}"
            else
              echo "## What's changed"
            fi
            echo
            bash .github/scripts/changelog.sh --since "$BASE"
            if [ -n "$BASE" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${BASE}...${TAG}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      # Same `test` stage the CI and preview-release workflows build: compiles midgard and
      # runs midgard_tests -sf, failing the job if anything regressed.
      - name: Build and test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          load: true
          tags: midgard-release-build:latest
          build-args: |
            GYC_RELEASE_TAG=${{ steps.version.outputs.ymir_bootstrap_version }}
            GYC_ASSET=${{ steps.version.outputs.gyc_asset }}
            GYLLIR_RELEASE_TAG=${{ steps.version.outputs.gyllir_version }}
            GYLLIR_ASSET=${{ steps.version.outputs.gyllir_asset }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract build artifacts
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          CID="$(docker create midgard-release-build:latest)"
          docker cp "${CID}:/midgard/libgymidgard_debug.a"   "./libmidgard_debug_${TAG}.a"
          docker cp "${CID}:/midgard/libgymidgard_release.a" "./libmidgard_release_${TAG}.a"
          docker cp "${CID}:/midgard/libgymidgard_tests.a"   "./libmidgard_tests_${TAG}.a"
          docker rm "${CID}"

      - name: Build source zip
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
        run: zip -r "midgard-${TAG}-src.zip" midgard/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Release $TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "midgard-${TAG}-src.zip" \
            "libmidgard_debug_${TAG}.a" \
            "libmidgard_release_${TAG}.a" \
            "libmidgard_tests_${TAG}.a"

      # --merge, never squash/rebase: both rewrite the commit just tagged, which would leave the
      # tag on a commit master never contains. --match-head-commit: refuse if the branch moved.
      - name: Merge ${{ github.ref_name }}'s pull request
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            echo "::warning::no open pull request from ${GITHUB_REF_NAME} - nothing to merge."
            exit 0
          fi
          gh pr merge "$PR" --merge --match-head-commit "$GITHUB_SHA"
          echo "Merged #${PR} (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
