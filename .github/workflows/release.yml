name: Release

# Manual, production counterpart to release-preview.yml: unlike the preview job, this fails
# instead of overwriting if the target version has already been released. The tag/release name
# is v<ymirBootstrapVersion>__m<midgardVersion>, read from YMIR_VERSION and VERSION - bump one
# or both of those files before dispatching this again for a new release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          MIDGARD_VERSION="$(tr -d '[:space:]' < VERSION)"
          # YMIR_SHORT_VERSION names the libgymidgard-*.a artifacts; GCC_MAJOR names the gyc .deb.
          YMIR_SHORT_VERSION="$(echo "$YMIR_BOOTSTRAP_VERSION" | cut -d. -f1,2)"
          GCC_MAJOR="${GCC_VERSION%%.*}"
          TAG_NAME="${MIDGARD_VERSION}"
          echo "midgard_version=${MIDGARD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_bootstrap_version=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_short_version=${YMIR_SHORT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gcc_version=${GCC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure this version has not already been released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists - bump VERSION and/or YMIR_VERSION before releasing again."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin (with no matching release) - bump VERSION and/or YMIR_VERSION before releasing again."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      # Same `test` stage the CI and preview-release workflows build: compiles midgard and
      # runs midgard_tests -sf, failing the job if anything regressed.
      - name: Build and test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          load: true
          tags: midgard-release-build:latest
          build-args: |
            GYC_RELEASE_TAG=${{ steps.version.outputs.ymir_bootstrap_version }}
            GYC_ASSET=${{ steps.version.outputs.gyc_asset }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract build artifacts
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          YMIR_SHORT_VERSION: ${{ steps.version.outputs.ymir_short_version }}
        run: |
          CID="$(docker create midgard-release-build:latest)"
          docker cp "${CID}:/midgard/.build/libgymidgard-debug_${YMIR_SHORT_VERSION}.a"   "./libmidgard_debug_${TAG}.a"
          docker cp "${CID}:/midgard/.build/libgymidgard-release_${YMIR_SHORT_VERSION}.a" "./libmidgard_release_${TAG}.a"
          docker cp "${CID}:/midgard/.build/libgymidgard-tests_${YMIR_SHORT_VERSION}.a"   "./libmidgard_tests_${TAG}.a"
          docker rm "${CID}"

      - name: Build source zip
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
        run: zip -r "midgard-${TAG}-src.zip" midgard/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
          MIDGARD_VERSION: ${{ steps.version.outputs.midgard_version }}
          YMIR_BOOTSTRAP_VERSION: ${{ steps.version.outputs.ymir_bootstrap_version }}
          GCC_VERSION: ${{ steps.version.outputs.gcc_version }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Release $TAG" \
            --notes "Midgard ${MIDGARD_VERSION}, built against ymir bootstrap ${YMIR_BOOTSTRAP_VERSION} (gcc ${GCC_VERSION}) @ ${{ github.sha }}." \
            "midgard-${TAG}-src.zip" \
            "libmidgard_debug_${TAG}.a" \
            "libmidgard_release_${TAG}.a" \
            "libmidgard_tests_${TAG}.a"
