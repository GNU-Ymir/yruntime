name: Preview Release (dev)

# Rolling pre-release, manually triggered (pick the branch/ref - normally dev - from the
# "Run workflow" button). The tag/release name is v<ymirBootstrapVersion>__m<midgardVersion> -
# it only changes when VERSION (midgard) or YMIR_VERSION (ymir bootstrap) is bumped, so
# repeated runs in between land on the *same* name and simply replace the previous preview.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-release:
    runs-on: [self-hosted, linux, x64]
    steps:
      # fetch-depth: 0 so the changelog step below has the history and the tags it walks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The self-hosted runners have no gh CLI of their own; the release steps below need one.
      - uses: ./.github/actions/setup-gh

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          MIDGARD_VERSION="$(tr -d '[:space:]' < VERSION)"
          # MIDGARD_SHORT_VERSION names the libgymidgard-*.a artifacts (see CMakeLists.txt - the midgard
          # release, not the gyc it is built with); GCC_MAJOR names the gyc .deb.
          MIDGARD_SHORT_VERSION="$(echo "$MIDGARD_VERSION" | cut -d. -f1,2)"
          GCC_MAJOR="${GCC_VERSION%%.*}"
          echo "MIDGARD_VERSION=${MIDGARD_VERSION}" >> "$GITHUB_ENV"
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "midgard_short_version=${MIDGARD_SHORT_VERSION}" >> "$GITHUB_OUTPUT"

      # The preview body. The base is the last real release, never the previous preview: the
      # `preview` tag is rolling (and deleted below), so diffing against it would be meaningless.
      - name: Build release notes
        run: |
          set -euo pipefail

          BASE="$(bash .github/scripts/changelog.sh --print-base)"

          {
            echo "Automated preview release of midgard ${MIDGARD_VERSION}, built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}."
            echo "This tag is rolling - it always points at the most recent preview build."
            echo
            if [ -n "$BASE" ]; then
              echo "## What's changed since ${BASE}"
            else
              echo "## What's changed"
            fi
            echo
            bash .github/scripts/changelog.sh --since "$BASE"
            if [ -n "$BASE" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${BASE}...${GITHUB_SHA}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      # Same `test` stage the CI workflow builds: compiles midgard and runs midgard_tests -sf,
      # failing the job (and skipping the release) if anything regressed.
      - name: Build and test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          load: true
          tags: midgard-preview-build:latest
          build-args: |
            GYC_RELEASE_TAG=${{ steps.version.outputs.gyc_release_tag }}
            GYC_ASSET=${{ steps.version.outputs.gyc_asset }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract build artifacts
        env:
          MIDGARD_SHORT_VERSION: ${{ steps.version.outputs.midgard_short_version }}
        run: |
          CID="$(docker create midgard-preview-build:latest)"
          docker cp "${CID}:/midgard/.build/libgymidgard-debug_${MIDGARD_SHORT_VERSION}.a"   "./libmidgard_debug_${MIDGARD_VERSION}.a"
          docker cp "${CID}:/midgard/.build/libgymidgard-release_${MIDGARD_SHORT_VERSION}.a" "./libmidgard_release_${MIDGARD_VERSION}.a"
          docker cp "${CID}:/midgard/.build/libgymidgard-tests_${MIDGARD_SHORT_VERSION}.a"   "./libmidgard_tests_${MIDGARD_VERSION}.a"
          docker rm "${CID}"

      - name: Build source zip
        run: zip -r "midgard-${MIDGARD_VERSION}-src.zip" midgard/

      - name: Replace existing preview tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "preview" --yes --cleanup-tag || true

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "preview" \
            --target "${{ github.sha }}" \
            --title "Preview ${MIDGARD_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease \
            "midgard-${MIDGARD_VERSION}-src.zip" \
            "libmidgard_debug_${MIDGARD_VERSION}.a" \
            "libmidgard_release_${MIDGARD_VERSION}.a" \
            "libmidgard_tests_${MIDGARD_VERSION}.a"
